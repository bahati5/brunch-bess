<html lang="fr">
<head>
<meta charset="utf-8">

<title>Ma réservation — Grand Brunch Retrouvailles</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;700&family=Kaushan+Script&family=Manrope:wght@400;500;600;700;800&display=swap">

</head>
<body class="page">
<header class="mini-top">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Retour à l'invitation">
      <img src="img/logo-bessieux-96.png" alt="" width="44" height="44">
      <span class="txt"><span class="script">Grand Brunch</span><span class="caps">Retrouvailles</span></span>
    </a>
    <nav><a href="index.html">L'invitation</a></nav>
  </div>
</header>

<main>
  <div class="narrow" id="app" aria-live="polite">
    <p class="muted">Chargement de ta réservation…</p>
  </div>
</main>

<!-- Retrouver une réservation -->
<template id="tpl-lookup">
  <h1 class="script page-title">Ma réservation</h1>
  <p class="lead">Indique la référence reçue lors de ta réservation (elle commence par BB-) et ton numéro WhatsApp.</p>
  <form class="card stack" id="lookup" novalidate>
    <div><label for="l-ref">Référence</label><input id="l-ref" autocapitalize="characters" placeholder="BB-XXXXX" required></div>
    <div><label for="l-tel">Numéro WhatsApp</label><input id="l-tel" type="tel" inputmode="tel" placeholder="0XX XX XX XX" required></div>
    <p class="alert ko hidden" id="l-err" role="alert"></p>
    <button class="btn btn-sun" type="submit">Retrouver ma réservation</button>
  </form>
  <p class="fine center" style="margin-top:18px"><a href="index.html#reserver">Pas encore de réservation ? Réserve ta place</a></p>
</template>

<!-- En attente de paiement -->
<template id="tpl-pay">
  <h1 class="script page-title">Plus qu'une étape !</h1>
  <p class="lead">Bonjour <b data-f="first_name"></b>, tes places sont bloquées jusqu'à <b data-f="expires_time"></b> (<span class="timer" id="timer"></span>).</p>

  <section class="card">
    <h2>1. Envoie l'argent</h2>
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><p class="caps muted" style="margin:0 0 4px">Montant exact</p><p class="amount" data-f="amount_fmt"></p></div>
      <button class="copy-btn" type="button" data-copy-value="amount">Copier</button>
    </div>
    <p class="muted" style="margin:4px 0 16px"><span data-f="places"></span> · sur l'un de ces numéros :</p>
    <div class="paynums" id="paynums"></div>
  </section>

  <section class="card">
    <h2>2. Envoie-nous la capture</h2>
    <p class="muted" style="margin:-4px 0 16px">Fais une capture d'écran du message de confirmation Airtel Money ou Moov Money, puis envoie-la ici.</p>
    <div id="proof"></div>
  </section>
</template>

<!-- Envoi de la capture (réutilisé : attente, vérification, refus, délai dépassé) -->
<template id="tpl-proof">
  <label class="btn btn-sun proof-btn">
    <input type="file" accept="image/*" class="sr" id="p-file">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span id="p-label">Envoyer ma capture</span>
  </label>
  <p class="alert ko hidden" id="p-err" role="alert" style="margin-top:12px"></p>
  <button class="linklike" type="button" id="p-nocap">Je n'ai pas de capture, mais j'ai payé</button>
  <div class="nocap hidden" id="p-nocap-box">
    <p>Pas de souci : l'équipe vérifiera ton paiement avec ton nom et le montant reçu.</p>
    <button class="btn btn-line" type="button" id="p-nocap-ok">Confirmer que j'ai payé</button>
  </div>
</template>

<!-- Paiement déclaré -->
<template id="tpl-declared">
  <h1 class="script page-title">Merci, on vérifie !</h1>
  <p class="lead">Merci <b data-f="first_name"></b> ! Dès que l'équipe confirme ton paiement, ton ticket s'affiche ici <span data-f="via"></span>.</p>
  <section class="card stack">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="pill wait">Vérification en cours</span>
      <span class="muted">Réf. <b data-f="ref"></b></span>
    </div>
    <dl class="kv">
      <dt>Montant</dt><dd data-f="amount_fmt"></dd>
      <dt>Capture</dt><dd data-f="proof_label"></dd>
    </dl>
    <p class="fine">Cette page se met à jour toute seule. Tu peux la fermer : pour la retrouver, garde ta référence <b data-f="ref"></b>.</p>
    <div class="row">
      <button class="btn btn-line" type="button" id="fix">Envoyer une autre capture</button>
      <a class="btn btn-line hidden" id="contact" target="_blank" rel="noopener">Contacter l'organisation</a>
    </div>
  </section>
  <section class="card hidden" id="fix-card">
    <h2>Envoyer une autre capture</h2>
    <div id="proof"></div>
  </section>
</template>

<!-- Ticket validé -->
<template id="tpl-ticket">
  <h1 class="script page-title">C'est tout bon !</h1>
  <p class="lead">Ton paiement est confirmé. Présente ce ticket à l'entrée, sur ton téléphone ou imprimé.</p>
  <div id="tk-slot"></div>
  <div class="tk-after"><span>Entrées utilisées : <b data-f="entries"></b></span><span data-f="venue_notes"></span></div>
  <div class="row" style="margin-top:18px">
    <button class="btn btn-sun" type="button" id="pdf">Télécharger le PDF</button>
    <a class="btn btn-line hidden" id="venue-map" target="_blank" rel="noopener">Itinéraire vers le lieu</a>
  </div>
  <p class="fine" id="mail-note"></p>
</template>

<!-- Refus / délai dépassé / annulé -->
<template id="tpl-problem">
  <h1 class="script page-title" data-f="title"></h1>
  <section class="card stack">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="pill" data-f="pill"></span>
      <span class="muted">Réf. <b data-f="ref"></b></span>
    </div>
    <p style="margin:0" data-f="text"></p>
    <p class="alert info hidden" id="reason"></p>
    <div class="row">
      <a class="btn btn-sun hidden" id="new-resa" href="index.html#reserver">Faire une nouvelle réservation</a>
      <a class="btn btn-line hidden" id="contact" target="_blank" rel="noopener">Contacter l'organisation</a>
    </div>
  </section>
  <section class="card hidden" id="redeclare-card">
    <h2>Tu as déjà payé ?</h2>
    <p class="muted" style="margin:-4px 0 14px">Envoie la capture de ton paiement de <span data-f="amount_fmt"></span>.</p>
    <div id="proof"></div>
  </section>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script src="assets/ticket.js"></script>
<script>
(function(){
  var app = document.getElementById("app");
  var params = new URLSearchParams(location.search);
  var ref = params.get("r"), token = params.get("t");
  var info = null, resa = null, poll = null, countdown = null;
  var OPS = {airtel:"Airtel Money", moov:"Moov Money"};

  function $(id){ return document.getElementById(id); }
  function show(el, yes){ el.classList.toggle("hidden", !yes); }

  function render(tplId, data){
    clearInterval(countdown);
    app.classList.remove("wide");
    var frag = $(tplId).content.cloneNode(true);
    frag.querySelectorAll("[data-f]").forEach(function(el){
      var v = data[el.getAttribute("data-f")];
      if (v == null || v === "") el.classList.add("hidden"); else el.textContent = v;
    });
    app.replaceChildren(frag);
    window.scrollTo(0, 0);
  }

  function view(r){
    var places = r.quantity + (r.quantity > 1 ? " places" : " place");
    return {
      ref:r.ref, first_name:r.first_name, full_name:(r.first_name + " " + (r.last_name || "")).trim(), promo:r.promo, email:r.email,
      via:"et t'est envoyé sur WhatsApp" + (r.email ? " et par e-mail" : ""),
      proof_label:r.has_proof ? "Reçue ✓" : r.txn_id ? "ID " + r.txn_id : "Sans capture",
      amount_fmt:Brunch.fcfa(r.amount), places:places, expires_time:r.expires_at ? Brunch.time(r.expires_at) : "",
      op_label:OPS[r.operator] || "", payer_phone:Brunch.fmtPhone(r.payer_phone), txn_id:r.txn_id, ticket_code:r.ticket_code,
      entries:r.checked_in + " / " + r.quantity,
      venue_notes:r.venue && r.venue.notes ? "Accès : " + r.venue.notes : ""
    };
  }

  function contactLink(){
    var a = $("contact"); if (!a || !info || !info.contact_whatsapp) return;
    a.href = Brunch.waLink(info.contact_whatsapp, "Bonjour, j'ai une question sur ma réservation " + resa.ref + " pour le Grand Brunch Retrouvailles.");
    show(a, true);
  }

  // --- Envoi de la capture, partagé par plusieurs états ---
  // Réduit la photo (1600 px max, JPEG) pour qu'elle parte vite même avec une connexion faible
  function compress(file){
    return new Promise(function(ok){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ ok(b || file); }, "image/jpeg", .82);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); ok(file); };
      img.src = url;
    });
  }
  async function errorOf(res){
    try { var d = await res.error.context.json(); return d.hint || d.error; } catch(e){ return Brunch.errorText(res.error); }
  }
  function mountProof(){
    var box = $("proof"); if (!box) return;
    box.appendChild($("tpl-proof").content.cloneNode(true));
    var err = $("p-err"), label = $("p-label");
    function busy(on, text){ label.textContent = text || "Envoyer ma capture"; label.parentNode.classList.toggle("is-busy", on); $("p-file").disabled = on; }
    function fail(msg){ err.textContent = msg; show(err, true); busy(false); }
    function done(){ Brunch.notifyAdmins(ref, token); return load(); }
    $("p-file").addEventListener("change", async function(){
      var file = this.files && this.files[0]; this.value = "";
      if (!file) return;
      show(err, false);
      if (!/^image\//.test(file.type)) return fail("Choisis une image : la capture d'écran de ton message de paiement.");
      busy(true, "Envoi en cours…");
      var blob = await compress(file);
      if (blob.size > 6 * 1024 * 1024) return fail("Cette image est trop lourde. Fais plutôt une capture d'écran.");
      var fd = new FormData();
      fd.append("ref", ref); fd.append("token", token);
      fd.append("file", blob, blob.type === "image/jpeg" ? "capture.jpg" : file.name);
      var res = await Brunch.sb.functions.invoke("upload-proof", {body:fd});
      if (res.error) return fail(await errorOf(res) || "L'envoi a échoué. Vérifie ta connexion et réessaie.");
      busy(true, "Capture envoyée ✓"); done();
    });
    $("p-nocap").onclick = function(){ show($("p-nocap-box"), true); show(this, false); };
    $("p-nocap-ok").onclick = function(){
      var b = this; b.disabled = true;
      Brunch.rpc("declare_proof", {p_ref:ref, p_token:token}).then(done)
        .catch(function(e){ b.disabled = false; err.textContent = Brunch.errorText(e); show(err, true); });
    };
  }

  // --- États ---
  function renderPay(){
    render("tpl-pay", view(resa));
    var nums = [["airtel", info.airtel_number, info.airtel_name], ["moov", info.moov_number, info.moov_name]].filter(function(n){ return n[1]; });
    var list = $("paynums");
    if (!nums.length) list.append(Object.assign(document.createElement("p"), {className:"muted", textContent:"Les numéros de paiement arrivent très bientôt."}));
    nums.forEach(function(n){
      var card = document.createElement("div"); card.className = "paynum " + n[0];
      var txt = document.createElement("div");
      var op = document.createElement("span"); op.className = "op-name"; op.textContent = OPS[n[0]];
      var num = document.createElement("b"); num.textContent = n[1];
      txt.append(op, num);
      if (n[2]){ var who = document.createElement("span"); who.className = "muted"; who.textContent = "Au nom de " + n[2]; txt.append(who); }
      var btn = document.createElement("button"); btn.type = "button"; btn.className = "copy-btn"; btn.textContent = "Copier"; btn.dataset.copyText = n[1].replace(/\s/g, "");
      card.append(txt, btn); list.append(card);
    });
    app.querySelectorAll(".copy-btn").forEach(function(b){
      b.addEventListener("click", function(){
        Brunch.copy(b.dataset.copyText || String(resa.amount)).then(function(){ b.textContent = "Copié !"; setTimeout(function(){ b.textContent = "Copier"; }, 1600); });
      });
    });
    mountProof();

    var end = new Date(resa.expires_at);
    function step(){
      var ms = end - new Date();
      if (ms <= 0){ clearInterval(countdown); load(); return; }
      var m = Math.floor(ms / 6e4), s = Math.floor(ms % 6e4 / 1e3);
      $("timer").textContent = (m >= 60 ? Math.floor(m / 60) + " h " + String(m % 60).padStart(2, "0") : m) + " min " + String(s).padStart(2, "0") + " s";
    }
    step(); countdown = setInterval(step, 1000);
  }

  function renderDeclared(){
    render("tpl-declared", view(resa));
    contactLink();
    $("fix").onclick = function(){ show($("fix-card"), true); show($("fix"), false); $("fix-card").scrollIntoView({behavior:"smooth"}); };
    mountProof();
    poll = setTimeout(function(){ load(true); }, 20000);
  }

  function renderTicket(){
    render("tpl-ticket", view(resa));
    app.classList.add("wide");
    $("tk-slot").append(Ticket.render(resa));
    if (resa.venue && resa.venue.maps_url){ $("venue-map").href = resa.venue.maps_url; show($("venue-map"), true); }
    $("pdf").onclick = function(){
      var b = this; b.disabled = true; b.textContent = "Préparation…";
      Ticket.downloadPdf(resa).catch(function(){ $("mail-note").textContent = "Le PDF n'a pas pu être créé. Réessaie, ou fais une capture d'écran du ticket."; })
        .then(function(){ b.disabled = false; b.textContent = "Télécharger le PDF"; });
    };
    $("mail-note").textContent = resa.email ? "Une copie de ton ticket est envoyée à " + resa.email + "." : "Garde ce lien ou télécharge le PDF : c'est ton ticket.";
    if (!resa.email_sent) Brunch.sendTicket({ref:ref, token:token});
  }

  function renderProblem(){
    var d = view(resa);
    if (resa.status === "expired"){
      d.title = "Délai dépassé"; d.pill = "Places libérées";
      d.text = "Le paiement n'a pas été déclaré à temps : tes places ont été remises en vente.";
    } else if (resa.status === "rejected"){
      d.title = "Paiement non confirmé"; d.pill = "Refusé";
      d.text = "L'équipe n'a pas pu confirmer ton paiement. Renvoie une capture plus lisible, ou contacte l'organisation.";
    } else {
      d.title = "Réservation annulée"; d.pill = "Annulée";
      d.text = "Cette réservation a été annulée. Contacte l'organisation si c'est une erreur.";
    }
    render("tpl-problem", d);
    app.querySelector(".pill").classList.add(resa.status === "rejected" ? "ko" : "off");
    if (resa.rejected_reason){ $("reason").textContent = "Motif : " + resa.rejected_reason; show($("reason"), true); }
    show($("new-resa"), resa.status !== "rejected" || !resa.can_redeclare);
    if (resa.can_redeclare){ show($("redeclare-card"), true); mountProof(); }
    contactLink();
  }

  function renderLookup(message){
    clearTimeout(poll); render("tpl-lookup", {});
    var last = Brunch.recall();
    if (last && last.ref){ $("l-ref").value = last.ref; }
    if (message){ $("l-err").textContent = message; show($("l-err"), true); }
    $("lookup").addEventListener("submit", function(ev){
      ev.preventDefault();
      var r = $("l-ref").value.trim().toUpperCase(), tel = Brunch.normPhone($("l-tel").value);
      if (!r || !tel){ $("l-err").textContent = "Remplis les deux champs."; show($("l-err"), true); return; }
      Brunch.rpc("find_reservation", {p_ref:r, p_whatsapp:tel}).then(function(res){
        if (!res){ $("l-err").textContent = "Aucune réservation ne correspond. Vérifie la référence et le numéro."; show($("l-err"), true); return; }
        location.href = Brunch.resaUrl(res.ref, res.token);
      }).catch(function(e){ $("l-err").textContent = Brunch.errorText(e); show($("l-err"), true); });
    });
  }

  function load(silent){
    clearTimeout(poll);
    return Promise.all([Brunch.rpc("get_reservation", {p_ref:ref, p_token:token}), info ? info : Brunch.rpc("get_public_info")])
      .then(function(res){
        info = res[1];
        var next = res[0];
        if (!next){ Brunch.forget(); renderLookup("Ce lien de réservation n'est pas valide."); return; }
        // Pendant la vérification, on ne redessine que si le statut change (évite d'effacer une saisie)
        if (silent && resa && next.status === resa.status){ resa = next; poll = setTimeout(function(){ load(true); }, 20000); return; }
        resa = next; Brunch.remember(ref, token);
        if (resa.status === "pending") renderPay();
        else if (resa.status === "declared") renderDeclared();
        else if (resa.status === "validated") renderTicket();
        else renderProblem();
      })
      .catch(function(e){
        if (silent){ poll = setTimeout(function(){ load(true); }, 30000); return; }
        app.innerHTML = ""; var p = document.createElement("p"); p.className = "alert ko"; p.textContent = Brunch.errorText(e); app.appendChild(p);
      });
  }

  if (!ref || !token){
    var last = Brunch.recall();
    if (last && last.ref && last.token && !params.has("chercher")){ location.replace(Brunch.resaUrl(last.ref, last.token)); return; }
    renderLookup();
  } else load();
})();
</script>
</body>
</html>
